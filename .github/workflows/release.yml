name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:

  # ── macOS (universal arm64 + x86_64) ───────────────────────────────────────
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Sync crate versions to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          find . -path ./target -prune -o -name Cargo.toml -print \
            | xargs sed -i.bak -E '3 s/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/version = "'"$VERSION"'"/'
          find . -name 'Cargo.toml.bak' -delete
          # Refresh Cargo.lock with the new versions so build does not error.
          cargo update --workspace

      - name: Build arm64 + x86_64
        run: |
          cargo build --release -p teletipo --target aarch64-apple-darwin
          cargo build --release -p teletipo --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/teletipo \
            target/x86_64-apple-darwin/release/teletipo \
            -output dist/teletipo-macos-universal-bin

      - name: Build icons
        run: |
          mkdir -p dist/Teletipo.iconset
          sips -z 16   16   docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_16x16.png      >/dev/null
          sips -z 32   32   docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_16x16@2x.png   >/dev/null
          sips -z 32   32   docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_32x32.png      >/dev/null
          sips -z 64   64   docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_32x32@2x.png   >/dev/null
          sips -z 128  128  docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_128x128.png    >/dev/null
          sips -z 256  256  docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256  256  docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_256x256.png    >/dev/null
          sips -z 512  512  docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512  512  docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_512x512.png    >/dev/null
          sips -z 1024 1024 docs/teletipo128x128.png --out dist/Teletipo.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns dist/Teletipo.iconset -o dist/Teletipo.icns

      - name: Build .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/Teletipo.app/Contents/MacOS
          mkdir -p dist/Teletipo.app/Contents/Resources
          cp dist/teletipo-macos-universal-bin dist/Teletipo.app/Contents/MacOS/teletipo
          chmod +x dist/Teletipo.app/Contents/MacOS/teletipo
          cp dist/Teletipo.icns dist/Teletipo.app/Contents/Resources/Teletipo.icns
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleDevelopmentRegion</key><string>en</string>' \
            '  <key>CFBundleDisplayName</key><string>Teletipo</string>' \
            '  <key>CFBundleExecutable</key><string>teletipo</string>' \
            '  <key>CFBundleIconFile</key><string>Teletipo</string>' \
            '  <key>CFBundleIdentifier</key><string>dev.teletipo.app</string>' \
            '  <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>' \
            '  <key>CFBundleName</key><string>Teletipo</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            "  <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            "  <key>CFBundleVersion</key><string>${VERSION}</string>" \
            '  <key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' > dist/Teletipo.app/Contents/Info.plist

      - name: Package archives
        run: |
          cp dist/teletipo-macos-universal-bin dist/teletipo
          mkdir -p dist/teletipo-macos-universal
          cp dist/teletipo dist/teletipo-macos-universal/teletipo
          cp scripts/install/install.sh dist/teletipo-macos-universal/install.sh
          cp scripts/install/uninstall.sh dist/teletipo-macos-universal/uninstall.sh
          cp scripts/install/README-install.txt dist/teletipo-macos-universal/README-install.txt
          # Include bare `teletipo` at archive root so that binaries older than
          # v0.0.6 (which used bin_path_in_archive = "teletipo") can self-update.
          tar -czf dist/teletipo-macos-universal.tar.gz -C dist teletipo teletipo-macos-universal
          rm dist/teletipo
          mkdir -p dist/teletipo-macos-app
          cp -R dist/Teletipo.app dist/teletipo-macos-app/Teletipo.app
          cp scripts/install/install.sh dist/teletipo-macos-app/install.sh
          cp scripts/install/uninstall.sh dist/teletipo-macos-app/uninstall.sh
          cp scripts/install/README-install.txt dist/teletipo-macos-app/README-install.txt
          tar -czf dist/teletipo-macos-app.tar.gz -C dist teletipo-macos-app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/teletipo-macos-universal.tar.gz
            dist/teletipo-macos-app.tar.gz

  # ── Linux x86_64 (cross-compiled for glibc compatibility) ──────────────────
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Sync crate versions to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          find . -path ./target -prune -o -name Cargo.toml -print \
            | xargs sed -i.bak -E '3 s/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/version = "'"$VERSION"'"/'
          find . -name 'Cargo.toml.bak' -delete
          cargo update --workspace

      - name: Build
        run: cross build --release -p teletipo --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="dist/teletipo-linux-x86_64"
          mkdir -p "$PKG_DIR"
          mkdir -p "$PKG_DIR/share/icons/hicolor/128x128/apps"
          mkdir -p "$PKG_DIR/share/applications"
          cp target/x86_64-unknown-linux-gnu/release/teletipo "$PKG_DIR/teletipo"
          cp docs/teletipo128x128.png "$PKG_DIR/share/icons/hicolor/128x128/apps/teletipo.png"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Teletipo' \
            "Comment=Teletipo Terminal v${VERSION}" \
            'Exec=teletipo' \
            'Icon=teletipo' \
            'Terminal=false' \
            'Categories=System;TerminalEmulator;' \
            'StartupWMClass=teletipo' \
            > "$PKG_DIR/share/applications/teletipo.desktop"
          cp scripts/install/install.sh "$PKG_DIR/install.sh"
          cp scripts/install/uninstall.sh "$PKG_DIR/uninstall.sh"
          cp scripts/install/README-install.txt "$PKG_DIR/README-install.txt"
          tar -czf dist/teletipo-linux-x86_64.tar.gz -C dist teletipo-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/teletipo-linux-x86_64.tar.gz

  # ── Windows x86_64 (cross-compiled via MinGW) ──────────────────────────────
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Sync crate versions to tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Get-ChildItem -Recurse -Filter Cargo.toml `
            | Where-Object { $_.FullName -notmatch '\\target\\' } `
            | ForEach-Object {
                $lines = Get-Content $_.FullName
                if ($lines.Count -ge 3 -and $lines[2] -match '^version = "[0-9]+\.[0-9]+\.[0-9]+"$') {
                    $lines[2] = "version = `"$version`""
                    Set-Content -Path $_.FullName -Value $lines
                }
            }
          cargo update --workspace

      - name: Build
        run: cargo build --release -p teletipo

      - name: Package
        shell: pwsh
        run: |
          $pkgDir = "dist/teletipo-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item "target/release/teletipo.exe" "$pkgDir/teletipo.exe"
          Copy-Item "scripts/install/install.ps1" "$pkgDir/install.ps1"
          Copy-Item "scripts/install/uninstall.ps1" "$pkgDir/uninstall.ps1"
          Copy-Item "scripts/install/README-install.txt" "$pkgDir/README-install.txt"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "dist/teletipo-windows-x86_64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/teletipo-windows-x86_64.zip

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Add standalone installers
        run: |
          cp scripts/install/install.sh dist/install.sh
          cp scripts/install/install.ps1 dist/install.ps1
          cp scripts/install/README-install.txt dist/README-install.txt

      - name: Install zipsign
        run: cargo install zipsign --locked

      - name: Sign release archives
        env:
          TELETIPO_UPDATE_PRIVATE_KEY_B64: ${{ secrets.TELETIPO_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "${TELETIPO_UPDATE_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::Missing secret TELETIPO_UPDATE_PRIVATE_KEY_B64"
            exit 1
          fi

          keyfile="$(mktemp)"
          key_b64="$(printf '%s' "$TELETIPO_UPDATE_PRIVATE_KEY_B64" | tr -d '[:space:]')"

          # Accept both standard and URL-safe base64 encodings.
          key_b64="$(printf '%s' "$key_b64" | tr '_-' '/+')"
          case $((${#key_b64} % 4)) in
            2) key_b64="${key_b64}==" ;;
            3) key_b64="${key_b64}=" ;;
            0) ;;
            *)
              echo "::error::Invalid base64 length for TELETIPO_UPDATE_PRIVATE_KEY_B64"
              exit 1
              ;;
          esac

          if ! printf '%s' "$key_b64" | base64 --decode > "$keyfile"; then
            echo "::error::Failed to decode TELETIPO_UPDATE_PRIVATE_KEY_B64"
            exit 1
          fi

          key_len="$(wc -c < "$keyfile" | tr -d '[:space:]')"
          if [ "$key_len" -ne 64 ]; then
            echo "::error::Decoded private key must be 64 bytes for zipsign, got ${key_len}"
            exit 1
          fi

          zipsign sign tar dist/teletipo-macos-universal.tar.gz "$keyfile" --force
          zipsign sign tar dist/teletipo-macos-app.tar.gz "$keyfile" --force
          zipsign sign tar dist/teletipo-linux-x86_64.tar.gz "$keyfile" --force
          zipsign sign zip dist/teletipo-windows-x86_64.zip "$keyfile" --force
          (cd dist && sha256sum teletipo-macos-universal.tar.gz teletipo-macos-app.tar.gz teletipo-linux-x86_64.tar.gz teletipo-windows-x86_64.zip install.sh install.ps1 README-install.txt > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/teletipo-macos-universal.tar.gz
            dist/teletipo-macos-app.tar.gz
            dist/teletipo-linux-x86_64.tar.gz
            dist/teletipo-windows-x86_64.zip
            dist/install.sh
            dist/install.ps1
            dist/README-install.txt
            dist/SHA256SUMS
