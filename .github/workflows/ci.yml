name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo test --workspace --no-fail-fast

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo doc --workspace --no-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories bans licenses sources

  lint-installers:
    name: lint installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck and PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck powershell

      - name: Install PSScriptAnalyzer
        run: |
          pwsh -NoProfile -Command "Set-PSRepository -Name PSGallery -InstallationPolicy Trusted; Install-Module PSScriptAnalyzer -Scope CurrentUser -Force"

      - name: Lint shell scripts
        run: |
          shellcheck scripts/install/install.sh
          shellcheck scripts/install/uninstall.sh

      - name: Lint PowerShell scripts
        run: |
          pwsh -NoProfile -Command "Invoke-ScriptAnalyzer -Path scripts/install/install.ps1 -EnableExit"
          pwsh -NoProfile -Command "Invoke-ScriptAnalyzer -Path scripts/install/uninstall.ps1 -EnableExit"

      - name: Offline smoke test (install.sh)
        run: |
          tmp="$(mktemp -d)"
          cp scripts/install/install.sh "$tmp/install.sh"
          cp scripts/install/uninstall.sh "$tmp/uninstall.sh"
          touch "$tmp/teletipo"
          chmod +x "$tmp/teletipo" "$tmp/install.sh" "$tmp/uninstall.sh"
          "$tmp/install.sh" --from-archive "$tmp" --prefix "$tmp/prefix" --no-desktop --no-verify
          test -x "$tmp/prefix/bin/teletipo"
