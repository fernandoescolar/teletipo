[package]
name = "teletipo"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
bytemuck = "1"
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = "0.19"
winit = "0.29"

[dependencies]
app-cli = { path = "crates/app-cli" }
tracing-subscriber = { workspace = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"

[workspace.lints.clippy]
# Surfaced as guidance, not blocking. Phase 2 tasks T4/T14 will reduce these.
too_many_lines = "allow"
cognitive_complexity = "allow"
