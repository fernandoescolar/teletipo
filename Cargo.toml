[package]
name = "teletipo"
version = "9.9.9"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
bytemuck = "1"
fontdb = "0.23"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = "0.19"
winit = "0.29"

[dependencies]
app-cli = { path = "crates/app-cli" }
dirs = "5"
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
# `mimalloc` replaces the default system allocator. On macOS in particular the
# default allocator is reluctant to return freed memory to the OS, inflating
# RSS for long-running GUI processes. mimalloc returns memory aggressively and
# fragments less, typically cutting RSS by 20–40 % for wgpu/winit applications.
mimalloc = { version = "0.1", default-features = false }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"

[workspace.lints.clippy]
# Surfaced as warnings after T8/T9 split the largest functions; revisit if
# noise returns.
too_many_lines = "warn"
cognitive_complexity = "warn"
