[package]
name = "app-cli"
version = "9.9.9"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
app-orchestrator = { path = "../app-orchestrator" }
platform-abstraction = { path = "../platform-abstraction" }
terminal-pty = { path = "../terminal-pty" }
render-glow = { path = "../render-glow" }
render-model = { path = "../render-model" }
editor-lang = { path = "../editor-lang" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = { workspace = true }
winit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
dirs = "5"
toml = "0.9"
fontdb = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
self_update = { version = "0.44", default-features = false, features = [
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
    "signatures",
    "ureq",
    "rustls",
] }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = "1"

[lints]
workspace = true
