[package]
name = "app-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
app-orchestrator = { path = "../app-orchestrator" }
platform-abstraction = { path = "../platform-abstraction" }
terminal-pty = { path = "../terminal-pty" }
render-wgpu = { path = "../render-wgpu" }
ui = { path = "../ui" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
winit = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
toml = "0.8"
fontdb = "0.23"
self_update = { version = "0.44", default-features = false, features = [
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
    "ureq",
    "rustls",
] }
tracing = { workspace = true }
thiserror = "1"

[lints]
workspace = true
