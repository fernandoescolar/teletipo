[package]
name = "render-wgpu"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
bytemuck = "1"
fontdue = "0.7"
fontdb = "0.23"
platform-abstraction = { path = "../platform-abstraction" }
pollster = "0.3"
rustybuzz = "0.14"
wgpu = "0.19"
winit = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ttf-parser = "0.25"
tracing = { workspace = true }
thiserror = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.4"

[lints]
workspace = true
