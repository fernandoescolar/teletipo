[advisories]
unmaintained = "workspace"
yanked = "warn"
# quick-xml 0.38-0.39 have known DoS vulnerabilities; these are pulled in by self_update.
# Update self_update or quick-xml when a fix is available.
ignore = [
	"RUSTSEC-2026-0194",  # Quadratic run time when checking start tag
	"RUSTSEC-2026-0195",  # Unbounded namespace-declaration allocation
]

[licenses]
allow = [
	"MIT",
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"MIT-0",
	"BSL-1.0",
	"CC0-1.0",
	"Unicode-3.0",
	"MPL-2.0",
	"Zlib",
	"CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"