[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
allow = [
	"MIT",
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"MIT-0",
	"BSL-1.0",
	"CC0-1.0",
	"Unicode-3.0",
	"MPL-2.0",
	"Zlib",
	"CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"